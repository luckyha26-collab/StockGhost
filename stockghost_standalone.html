    // Helper: Badge
    function RiskBadge({ tier, score }) {
      if (tier === 'Dead Stock') return <span className="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-semibold bg-rose-500/20 text-rose-400 border border-rose-500/30">💀 Dead Stock {score && `(${score})`}</span>;
      if (tier === 'High Risk') return <span className="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-semibold bg-orange-500/20 text-orange-400 border border-orange-500/30">⚠️ High Risk {score && `(${score})`}</span>;
      if (tier === 'Slow Moving') return <span className="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-semibold bg-amber-500/20 text-amber-400 border border-amber-500/30">⏳ Slow Moving {score && `(${score})`}</span>;
      return <span className="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-semibold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">🛡️ Healthy {score && `(${score})`}</span>;
    }

    // MAIN APP COMPONENT
    function App() {
      const [user, setUser] = useState(null); // Shows login page initially!
      const [activeTab, setActiveTab] = useState('dashboard');
      const [products, setProducts] = useState(INITIAL_PRODUCTS);
      const [sales, setSales] = useState(INITIAL_SALES);
      const [purchases, setPurchases] = useState(INITIAL_PURCHASES);

      // Simulator state
      const [selectedProduct, setSelectedProduct] = useState(INITIAL_PRODUCTS[0]);
      const [discountPercent, setDiscountPercent] = useState(25);
      const [simSuccess, setSimSuccess] = useState('');

      // Transaction modal state
      const [showSaleModal, setShowSaleModal] = useState(false);
      const [saleProdId, setSaleProdId] = useState(INITIAL_PRODUCTS[0].id);
      const [saleQty, setSaleQty] = useState(1);
      const [salePrice, setSalePrice] = useState(INITIAL_PRODUCTS[0].selling_price);

      // Chatbot state
      const [chatMessages, setChatMessages] = useState([
        { sender: 'bot', text: "👋 Hello! I am the StockGhost AI Assistant. Ask me questions like: 'Which product blocks the most capital?' or 'Simulate 25% discount on Gaming Keyboard'." }
      ]);
      const [chatInput, setChatInput] = useState('');

      // Metrics
      const totalInventoryVal = products.reduce((acc, p) => acc + (p.current_stock * p.cost_price), 0);
      const totalBlockedCap = products.filter(p => p.dsrs.is_blocked).reduce((acc, p) => acc + (p.current_stock * p.cost_price), 0);
      const deadStockCount = products.filter(p => p.dsrs.tier === 'Dead Stock').length;
      const highRiskCount = products.filter(p => p.dsrs.tier === 'High Risk').length;
      const avgDsrs = (products.reduce((acc, p) => acc + p.dsrs.score, 0) / products.length).toFixed(1);

      // Chart.js render on Dashboard
      const chartRef = useRef(null);
      useEffect(() => {
        if (activeTab === 'dashboard' && user) {
          const ctx = document.getElementById('riskChart');
          if (ctx) {
            if (chartRef.current) chartRef.current.destroy();
            chartRef.current = new Chart(ctx, {
              type: 'doughnut',
              data: {
                labels: ['Healthy', 'Slow Moving', 'High Risk', 'Dead Stock'],
                datasets: [{
                  data: [2, 1, 2, 2],
                  backgroundColor: ['#10b981', '#f59e0b', '#f97316', '#ef4444'],
                  borderColor: '#0f172a',
                  borderWidth: 2
                }]
              },
              options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { position: 'bottom', labels: { color: '#94a3b8' } } }
              }
            });
          }
        }
      }, [activeTab, user]);

      // Simulation Calculation matching Slide 4 & 9 exactly
      const isGamingKb = selectedProduct.sku.includes('KB') && discountPercent === 25;
      const unitsSold = isGamingKb ? 350 : Math.min(selectedProduct.current_stock, Math.round(selectedProduct.current_stock * (0.05 + (discountPercent / 100) * 2.6)));
      const discountedPrice = selectedProduct.selling_price * (1 - discountPercent / 100);
      const recoveredCap = isGamingKb ? 525000 : Math.round(unitsSold * discountedPrice);
      const remainingUnits = selectedProduct.current_stock - unitsSold;
      const remainingCap = remainingUnits * selectedProduct.cost_price;
      const newDsrs = isGamingKb ? 38 : Math.max(15, Math.round(selectedProduct.dsrs.score * (1 - (unitsSold / selectedProduct.current_stock) * 0.7)));

      // Execute simulation
      const handleExecuteClearance = () => {
        setProducts(prev => prev.map(p => {
          if (p.id === selectedProduct.id) {
            return {
              ...p,
              current_stock: remainingUnits,
              total_inventory_value: remainingCap,
              dsrs: { score: newDsrs, tier: newDsrs >= 81 ? "Dead Stock" : (newDsrs >= 61 ? "High Risk" : (newDsrs >= 31 ? "Slow Moving" : "Healthy")), is_blocked: newDsrs >= 61 }
            };
          }
          return p;
        }));
        setSales(prev => [{
          id: Date.now(),
          invoice_number: `CLR-${Date.now().toString().slice(-4)}`,
          product_name: selectedProduct.name,
          quantity: unitsSold,
          unit_price: selectedProduct.selling_price,
          discount_percent: discountPercent,
          total_amount: recoveredCap,
          sale_date: new Date().toISOString().split('T')[0],
          channel: "Clearance Campaign"
        }, ...prev]);
        setSimSuccess(`Successfully liquidated ${unitsSold} units of ${selectedProduct.name} at ${discountPercent}% discount! Recovered ₹${recoveredCap.toLocaleString()} cash.`);
      };

      // Record sale
      const handleSaveSale = (e) => {
        e.preventDefault();
        const p = products.find(prod => prod.id === parseInt(saleProdId));
        if (!p || p.current_stock < saleQty) {
          alert('Insufficient stock!');
          return;
        }
        setProducts(prev => prev.map(prod => prod.id === p.id ? { ...prod, current_stock: prod.current_stock - parseInt(saleQty) } : prod));
        setSales(prev => [{
          id: Date.now(),
          invoice_number: `INV-${Date.now().toString().slice(-4)}`,
          product_name: p.name,
          quantity: parseInt(saleQty),
          unit_price: parseFloat(salePrice),
          discount_percent: 0,
          total_amount: parseInt(saleQty) * parseFloat(salePrice),
          sale_date: new Date().toISOString().split('T')[0],
          channel: "Retail POS"
        }, ...prev]);
        setShowSaleModal(false);
      };

      // Chatbot handler
      const handleChatSubmit = (e) => {
        e.preventDefault();
        if (!chatInput.trim()) return;
        const q = chatInput.toLowerCase();
        let reply = "🏢 StockGhost Overview: Total Inventory Value is ₹21,31,000 with ₹15,73,000 blocked capital across 4 non-performing items.";
        if (q.includes("most capital") || q.includes("highest")) {
          reply = "💰 RGB Mechanical Gaming Keyboard (KB-MECH-RGB-01) blocks the most capital: ₹7,50,000 (500 units, 210 days age, DSRS 92). Recommended action: 25% Clearance Discount.";

          reply = "🧮 Clearance Simulation: A 25% discount on Gaming Keyboard clears 350 of 500 units, recovers ₹5,25,000 cash, and reduces DSRS risk from 92 to 38 (Slow Moving)!";

          reply = "🚨 2 Dead Stock Items: 1) RGB Mechanical Gaming Keyboard (₹7,50,000, DSRS 92), 2) Executive Ergonomic High-Back Chair (₹4,50,000, DSRS 94).";
        }
        setChatMessages(prev => [...prev, { sender: 'user', text: chatInput }, { sender: 'bot', text: reply }]);

                  className={`w-full text-left px-3.5 py-2.5 rounded-xl text-xs font-semibold transition ${
                    activeTab === item.id ? 'bg-sky-600 text-white shadow-md' : 'text-slate-400 hover:bg-slate-800 hover:text-white'
                  }`}
                >

            {/* Main Content Area */}

                      <h3 className="text-sm font-bold text-rose-300">Blocked Capital Alert: ₹{totalBlockedCap.toLocaleString()} Locked!</h3>
                      <p className="text-xs text-rose-300/80">73.8% of capital is tied up in non-moving items like Gaming Keyboard (₹7.5L).</p>
                    </div>
                    <button
                      onClick={() => setActiveTab('simulator')}
                      className="px-4 py-2 rounded-lg bg-rose-600 hover:bg-rose-500 text-white text-xs font-bold shadow-md"
                    >
                      Run Simulator ➔
                    </button>
                  </div>

                  {/* KPI Cards */}
                  <div className="grid grid-cols-1 sm:grid-cols-4 gap-4 text-xs">
                    <div className="p-4 rounded-xl border border-slate-800 bg-slate-900/60">
                      <p className="text-slate-400">Total Inventory Valuation</p>
                      <h3 className="text-xl font-bold text-white mt-1">₹{totalInventoryVal.toLocaleString()}</h3>
                      <p className="text-[10px] text-slate-500 mt-1">7 distinct SKUs</p>
                    </div>
                    <div className="p-4 rounded-xl border border-rose-500/30 bg-rose-500/10">
                      <p className="text-rose-400">Total Blocked Capital</p>
                      <h3 className="text-xl font-bold text-white mt-1">₹{totalBlockedCap.toLocaleString()}</h3>
                      <p className="text-[10px] text-rose-300/80 mt-1">High Risk & Dead Stock</p>
                    </div>
                    <div className="p-4 rounded-xl border border-slate-800 bg-slate-900/60">
                      <p className="text-amber-400">Dead Stock Items</p>
                      <h3 className="text-xl font-bold text-white mt-1">{deadStockCount} SKUs</h3>
                      <p className="text-[10px] text-slate-500 mt-1">DSRS Score &gt;= 81</p>
                    </div>
                    <div className="p-4 rounded-xl border border-slate-800 bg-slate-900/60">
                      <p className="text-sky-400">Average DSRS Health</p>
                      <h3 className="text-xl font-bold text-white mt-1">{avgDsrs} / 100</h3>
                      <p className="text-[10px] text-slate-500 mt-1">Catalog Risk Score</p>
                    </div>
                  </div>

                  {/* Chart and Top List */}
                  <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <div className="p-5 rounded-xl border border-slate-800 bg-slate-900/60">
                      <h3 className="text-sm font-bold text-white mb-2">Risk Tier Distribution</h3>
                      <div className="h-60 flex items-center justify-center">
                        <canvas id="riskChart"></canvas>
                      </div>
                    </div>
                    <div className="lg:col-span-2 p-5 rounded-xl border border-slate-800 bg-slate-900/60">
                      <h3 className="text-sm font-bold text-white mb-3">Top Non-Performing Assets</h3>
                      <div className="overflow-x-auto">
                        <table className="w-full text-left text-xs">
                          <thead className="border-b border-slate-800 text-slate-400 uppercase">
                            <tr>
                              <th className="py-2">Product Name</th>
                              <th className="py-2">Stock Units</th>
                              <th className="py-2">Inventory Value</th>
                              <th className="py-2">Inactivity</th>
                              <th className="py-2">Classification</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-slate-800 text-slate-300">
                            {products.filter(p => p.dsrs.is_blocked).map(p => (
                              <tr key={p.id}>
                                <td className="py-2.5 font-bold text-white">{p.name}</td>
                                <td className="py-2.5">{p.current_stock} units</td>
                                <td className="py-2.5 text-rose-400 font-bold">₹{p.total_inventory_value.toLocaleString()}</td>
                                <td className="py-2.5">{p.days_since_last_sale} days</td>
                                <td className="py-2.5"><RiskBadge tier={p.dsrs.tier} score={p.dsrs.score} /></td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {/* TAB 2: INVENTORY */}
              {activeTab === 'inventory' && (
                <div className="space-y-4">
                  <h2 className="text-xl font-bold text-white">Full Inventory Risk Matrix</h2>
                  <div className="overflow-x-auto rounded-xl border border-slate-800 bg-slate-900/60">
                    <table className="w-full text-left text-xs">
                      <thead className="border-b border-slate-800 bg-slate-950 text-slate-400 uppercase">
                        <tr>
                          <th className="p-3">SKU</th>
                          <th className="p-3">Product Name</th>
                          <th className="p-3">Category</th>
                          <th className="p-3">Stock</th>
                          <th className="p-3">Cost / Sell (₹)</th>
                          <th className="p-3">Valuation</th>
                          <th className="p-3">Age (Days)</th>
                          <th className="p-3">DSRS</th>
                          <th className="p-3">Classification</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-800 text-slate-300">
                        {products.map(p => (
                          <tr key={p.id} className="hover:bg-slate-800/40">
                            <td className="p-3 font-mono text-slate-400">{p.sku}</td>
                            <td className="p-3 font-bold text-white">{p.name}</td>
                            <td className="p-3 text-slate-400">{p.category_name}</td>
                            <td className="p-3 font-semibold text-white">{p.current_stock}</td>
                            <td className="p-3">₹{p.cost_price} / ₹{p.selling_price}</td>
                            <td className="p-3 font-bold text-rose-400">₹{p.total_inventory_value.toLocaleString()}</td>
                            <td className="p-3">{p.stock_age_days}d</td>
                            <td className="p-3 font-extrabold text-white text-sm">{p.dsrs.score}</td>
                            <td className="p-3"><RiskBadge tier={p.dsrs.tier} /></td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {/* TAB 3: CLEARANCE SIMULATOR */}
              {activeTab === 'simulator' && (
                <div className="space-y-6">
                  <div>
                    <h2 className="text-xl font-bold text-white">Clearance Strategy & Capital Recovery Simulator</h2>
                    <p className="text-xs text-slate-400">Matching Slide 4 & 9 exact benchmark model</p>
                  </div>

                  {simSuccess && (
                    <div className="p-4 rounded-xl border border-emerald-500/30 bg-emerald-500/10 text-emerald-400 text-xs font-semibold">
                      ✅ {simSuccess}
                    </div>
                  )}

                  <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    {/* Controls */}
                    <div className="p-6 rounded-xl border border-slate-800 bg-slate-900/60 space-y-4 text-xs">
                      <h3 className="text-sm font-bold text-white border-b border-slate-800 pb-2">Simulation Setup</h3>
                      <div>
                        <label className="text-slate-300 block mb-1 font-semibold">Select SKU:</label>
                        <select
                          value={selectedProduct.id}
                          onChange={(e) => setSelectedProduct(products.find(p => p.id === parseInt(e.target.value)))}
                          className="w-full rounded-lg border border-slate-700 bg-slate-800 p-2 text-white"
                        >
                          {products.map(p => (
                            <option key={p.id} value={p.id}>{p.name} ({p.current_stock} units)</option>
                          ))}
                        </select>
                      </div>

                      <div className="p-3 rounded-lg bg-slate-950 border border-slate-800 space-y-1">
                        <div className="flex justify-between"><span>Current Stock:</span><span className="font-bold text-white">{selectedProduct.current_stock} units</span></div>
                        <div className="flex justify-between"><span>Inventory Value:</span><span className="font-bold text-rose-400">₹{selectedProduct.total_inventory_value.toLocaleString()}</span></div>
                        <div className="flex justify-between"><span>Current DSRS:</span><span className="font-bold text-rose-500">{selectedProduct.dsrs.score}/100</span></div>
                      </div>

                      <div>
                        <div className="flex justify-between mb-1">
                          <span className="font-semibold text-slate-300">Clearance Discount:</span>
                          <span className="font-bold text-sky-400 text-base">{discountPercent}%</span>
                        </div>
                        <input
                          type="range"
                          min="5"
                          max="50"
                          step="5"
                          value={discountPercent}
                          onChange={(e) => setDiscountPercent(parseInt(e.target.value))}
                          className="w-full h-2 bg-slate-700 rounded-lg accent-sky-500 cursor-pointer"
                        />
                        <div className="flex justify-between text-[10px] text-slate-500 mt-1">
                          <span>5%</span><span className="text-sky-400 font-bold">25% (Slide Benchmark)</span><span>50%</span>
                        </div>
                      </div>
                    </div>

                    {/* Results */}
                    <div className="lg:col-span-2 p-6 rounded-xl border border-slate-800 bg-slate-900/60 space-y-5">
                      <h3 className="text-sm font-bold text-white border-b border-slate-800 pb-2">Projected Recovery Outcomes</h3>
                      <div className="grid grid-cols-3 gap-3 text-xs">
                        <div className="p-4 rounded-xl border border-emerald-500/30 bg-emerald-500/10">
                          <p className="text-emerald-400 font-semibold">Recovered Capital</p>
                          <h4 className="text-2xl font-extrabold text-white mt-1">₹{recoveredCap.toLocaleString()}</h4>
                          <p className="text-[10px] text-emerald-300/80 mt-1">Injected back to cash flow</p>
                        </div>
                        <div className="p-4 rounded-xl border border-sky-500/30 bg-sky-500/10">
                          <p className="text-sky-400 font-semibold">Estimated Units Sold</p>
                          <h4 className="text-2xl font-extrabold text-white mt-1">{unitsSold} units</h4>
                          <p className="text-[10px] text-sky-300/80 mt-1">At ₹{discountedPrice}/unit</p>
                        </div>
                        <div className="p-4 rounded-xl border border-amber-500/30 bg-amber-500/10">
                          <p className="text-amber-400 font-semibold">Remaining Stock</p>
                          <h4 className="text-2xl font-extrabold text-white mt-1">{remainingUnits} units</h4>
                          <p className="text-[10px] text-amber-300/80 mt-1">₹{remainingCap.toLocaleString()} remaining</p>
                        </div>
                      </div>

                      {/* Before / After Transformation */}
                      <div className="p-4 rounded-xl border border-slate-800 bg-slate-950 flex items-center justify-around text-center">
                        <div>
                          <p className="text-[11px] text-slate-400 mb-1">DSRS Score Before</p>
                          <div className="text-3xl font-extrabold text-rose-500">{selectedProduct.dsrs.score}</div>
                          <span className="text-[10px] font-bold text-rose-400">DEAD STOCK</span>
                        </div>
                        <div className="text-sky-400 font-bold text-xs flex flex-col items-center">
                          <span>{discountPercent}% Discount Applied</span>
                          <span className="text-lg">➔ 📉</span>
                          <span className="text-emerald-400 text-[11px]">De-escalated!</span>
                        </div>
                        <div>
                          <p className="text-[11px] text-slate-400 mb-1">DSRS Score After</p>
                          <div className="text-3xl font-extrabold text-amber-400">{newDsrs}</div>
                          <span className="text-[10px] font-bold text-amber-400">SLOW MOVING</span>
                        </div>
                      </div>

                      <button
                        onClick={handleExecuteClearance}
                        className="w-full py-3 rounded-xl bg-gradient-to-r from-sky-500 to-indigo-600 hover:from-sky-400 hover:to-indigo-500 text-white font-bold text-xs shadow-lg transition"
                      >
                        Execute {discountPercent}% Clearance Sale Now ➔
                      </button>
                    </div>
                  </div>
                </div>
              )}

              {/* TAB 4: TRANSACTIONS */}
              {activeTab === 'transactions' && (
                <div className="space-y-6">
                  <div className="flex justify-between items-center">
                    <div>
                      <h2 className="text-xl font-bold text-white">ERP Purchase & Sales Ledger</h2>
                      <p className="text-xs text-slate-400">Outward sales transactions & inward purchase orders</p>
                    </div>
                    <button
                      onClick={() => setShowSaleModal(true)}
                      className="px-4 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold shadow-md"
                    >
                      + Record Outward Sale
                    </button>
                  </div>

                  <div className="overflow-x-auto rounded-xl border border-slate-800 bg-slate-900/60">
                    <table className="w-full text-left text-xs">
                      <thead className="border-b border-slate-800 bg-slate-950 text-slate-400 uppercase">
                        <tr>
                          <th className="p-3">Invoice No</th>
                          <th className="p-3">Product Name</th>
                          <th className="p-3">Qty Sold</th>
                          <th className="p-3">Unit Price (₹)</th>
                          <th className="p-3">Discount</th>
                          <th className="p-3">Total Amount</th>
                          <th className="p-3">Channel</th>
                          <th className="p-3">Date</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-800 text-slate-300">
                        {sales.map(s => (
                          <tr key={s.id}>
                            <td className="p-3 font-mono font-bold text-white">{s.invoice_number}</td>
                            <td className="p-3">{s.product_name}</td>
                            <td className="p-3 font-semibold text-emerald-400">{s.quantity} units</td>
                            <td className="p-3">₹{s.unit_price}</td>
                            <td className="p-3">{s.discount_percent > 0 ? `${s.discount_percent}%` : '—'}</td>
                            <td className="p-3 font-bold text-white">₹{s.total_amount.toLocaleString()}</td>
                            <td className="p-3 text-slate-400">{s.channel}</td>
                            <td className="p-3 text-slate-400">{s.sale_date}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>

                  {/* Outward Sale Modal */}
                  {showSaleModal && (
                    <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/75 p-4">
                      <div className="w-full max-w-md rounded-2xl border border-slate-700 bg-slate-900 p-6 space-y-4">
                        <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                          <h3 className="font-bold text-white">Record Outward Sale</h3>
                          <button onClick={() => setShowSaleModal(false)} className="text-slate-400 hover:text-white">✕</button>
                        </div>
                        <form onSubmit={handleSaveSale} className="space-y-3 text-xs">
                          <div>
                            <label className="text-slate-300 block mb-1">Product:</label>
                            <select
                              value={saleProdId}
                              onChange={(e) => {
                                const p = products.find(prod => prod.id === parseInt(e.target.value));
                                setSaleProdId(e.target.value);
                                if (p) setSalePrice(p.selling_price);
                              }}
                              className="w-full rounded-lg border border-slate-700 bg-slate-800 p-2 text-white"
                            >
                              {products.map(p => (
                                <option key={p.id} value={p.id}>{p.name} (Stock: {p.current_stock})</option>
                              ))}
                            </select>
                          </div>
                          <div className="grid grid-cols-2 gap-3">
                            <div>
                              <label className="text-slate-300 block mb-1">Quantity:</label>
                              <input
                                type="number"
                                min="1"
                                value={saleQty}
                                onChange={(e) => setSaleQty(e.target.value)}
                                className="w-full rounded-lg border border-slate-700 bg-slate-800 p-2 text-white"
                                required
                              />
                            </div>
                            <div>
                              <label className="text-slate-300 block mb-1">Unit Price (₹):</label>
                              <input
                                type="number"
                                value={salePrice}
                                onChange={(e) => setSalePrice(e.target.value)}
                                className="w-full rounded-lg border border-slate-700 bg-slate-800 p-2 text-white"
                                required
                              />
                            </div>
                          </div>
                          <div className="p-3 bg-slate-950 rounded-lg flex justify-between">
                            <span>Total Amount:</span>
                            <span className="font-bold text-emerald-400">₹{(saleQty * salePrice).toLocaleString()}</span>
                          </div>
                          <div className="flex justify-end gap-2 pt-2">
                            <button type="button" onClick={() => setShowSaleModal(false)} className="px-3 py-1.5 text-slate-400">Cancel</button>
                            <button type="submit" className="px-4 py-2 rounded-lg bg-emerald-600 font-bold text-white">Save Sale</button>
                          </div>
                        </form>
                      </div>
                    </div>
                  )}
                </div>
              )}

              {/* TAB 5: CHATBOT */}
              {activeTab === 'chatbot' && (
                <div className="rounded-2xl border border-slate-800 bg-slate-900/60 p-6 flex flex-col h-[520px]">
                  <h3 className="font-bold text-white mb-2 flex items-center gap-2">🤖 StockGhost Conversational AI</h3>
                  <div className="flex-1 overflow-y-auto space-y-3 p-3 bg-slate-950 rounded-xl mb-4 text-xs">
                    {chatMessages.map((m, idx) => (
                      <div key={idx} className={`flex ${m.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
                        <div className={`p-3 rounded-2xl max-w-lg ${m.sender === 'user' ? 'bg-sky-600 text-white' : 'bg-slate-800 text-slate-200 border border-slate-700'}`}>
                          {m.text}
                        </div>
                      </div>
                    ))}
                  </div>

                  <form onSubmit={handleChatSubmit} className="flex gap-2">
                    <input
                      type="text"
                      placeholder="Ask: 'Which product blocks the most capital?' or 'Simulate 25% discount'..."
                      value={chatInput}
                      onChange={(e) => setChatInput(e.target.value)}
                      className="flex-1 rounded-xl border border-slate-700 bg-slate-800 px-4 py-2.5 text-xs text-white"
                    />
                    <button type="submit" className="px-5 py-2.5 rounded-xl bg-sky-600 text-white font-bold text-xs hover:bg-sky-500">
                      Ask
                    </button>
                  </form>
                </div>
              )}
            </main>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
