<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%230284c7' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z'></path><polyline points='3.29 7 12 12 20.71 7'></polyline><line x1='12' y1='22' x2='12' y2='12'></line></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StockGhost — Dead Stock & Blocked Capital Detection</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-900 text-slate-100 antialiased font-sans selection:bg-sky-500 selection:text-white">
    <div id="root"></div>

    <!-- Fallback if opened directly as a file without Vite server -->
    <div id="file-protocol-helper" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#090d16;color:#f1f5f9;z-index:9999;display:none;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;padding:24px;box-sizing:border-box;">
      <div style="max-width:540px;width:100%;background:#0f172a;border:1px solid #1e293b;border-radius:16px;padding:32px;text-align:center;box-shadow:0 25px 50px -12px rgba(0,0,0,0.7);">
        <div style="font-size:48px;margin-bottom:12px;">👻</div>
        <h2 style="font-size:22px;font-weight:800;color:#fff;margin-bottom:8px;">StockGhost ERP</h2>
        <p style="font-size:12px;color:#38bdf8;font-weight:600;margin-bottom:16px;text-transform:uppercase;letter-spacing:1px;">Priyadarshini College of Engineering, IT Dept</p>
        <p style="color:#94a3b8;font-size:14px;line-height:1.6;margin-bottom:24px;">
          Redirecting you to the standalone StockGhost App...<br/>
          If your browser does not redirect automatically, click the button below:
        </p>
        <a href="../index.html" style="display:inline-block;background:linear-gradient(135deg,#0284c7,#4f46e5);color:#fff;font-weight:700;text-decoration:none;padding:14px 32px;border-radius:10px;font-size:15px;box-shadow:0 8px 20px rgba(2,132,199,0.35);">
          🚀 Launch StockGhost Application
        </a>
      </div>
    </div>

    <script>
      if (window.location.protocol === 'file:') {
        var helper = document.getElementById('file-protocol-helper');
        if (helper) helper.style.display = 'flex';
        try {
          window.location.replace('../index.html');
        } catch (e) {
          // If browser restricts replace, fallback button remains visible
        }
      }
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
